name: Release

# Push a version tag (npm run release:patch does it for you). This builds, packs and publishes:
#  - a GitHub Release with windows-development-sandbox-x.y.z.tgz, windows-development-sandbox.tgz and install.ps1, so
#    these always install the newest one:
#      irm https://github.com/<owner>/<repo>/releases/latest/download/install.ps1 | iex
#      npm install -g https://github.com/<owner>/<repo>/releases/latest/download/windows-development-sandbox.tgz
#  - a GitHub Package (npm.pkg.github.com) named @<owner>/windows-development-sandbox
#  - npm (registry.npmjs.org): the first version once from your PC (npm run publish:npm), then CI publishes each
#    release when an NPM_TOKEN secret is set (skipped without it; a failed npm publish is only a warning)
#
# It also runs on every push to master (and from the Actions tab, "Run workflow"): when package.json has a version
# that has no release yet, it tags v<version> and releases it. So bumping the version in a normal push is enough.
on:
  push:
    tags: ['v*']
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      released: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, to see whether this version is released already
      - name: Version to release
        id: version
        shell: pwsh
        env:
          # Through env, not inlined into the script: a crafted tag name cannot become PowerShell code.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -ne $tag) { throw "Tag $env:REF_NAME does not match package.json version $version" }
            $release = 'true'
          } else {
            # A branch push or a manual run releases only a version that has no tag yet.
            git rev-parse -q --verify "refs/tags/$tag" | Out-Null
            $release = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
            if ($release -eq 'false') { "$tag is already released; bump the version in package.json to release again." }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          # git rev-parse exits 1 for a new tag; without this the step would fail with that exit code.
          exit 0
      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.version.outputs.release == 'true'
      - run: npm run build
        if: steps.version.outputs.release == 'true'
      - name: Pack
        if: steps.version.outputs.release == 'true'
        id: pack
        shell: pwsh
        run: |
          # The packed release is already built: without prepare, npm installs it without running any package script.
          npm pkg delete scripts.prepare
          npm pack --silent | Out-Null
          $file = (Get-ChildItem windows-development-sandbox-*.tgz | Select-Object -First 1).Name
          Copy-Item $file windows-development-sandbox.tgz
          Copy-Item scripts/install.ps1 install.ps1
          # The checksum the installer and the updater fall back to when the API lists no digest for the asset.
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", "$hash  $file`n")
          "file=$file" >> $env:GITHUB_OUTPUT
      - name: Signing secrets
        if: steps.version.outputs.release == 'true'
        id: signing
        shell: pwsh
        env:
          # Through env, never inlined: the values reach the script only as environment variables.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          # Signing needs all six secrets. Without them it is skipped and the release goes out unsigned, as before.
          $names = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'TRUSTED_SIGNING_ENDPOINT', 'TRUSTED_SIGNING_ACCOUNT', 'TRUSTED_SIGNING_PROFILE'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            "Code signing skipped: no $($missing -join ', ') secret yet (docs/development.md, Signing releases)."
            exit 0
          }
          "sign=true" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Sign install.ps1
        if: steps.version.outputs.release == 'true' && steps.signing.outputs.sign == 'true'
        # Azure Artifact Signing (Trusted Signing), the official action, pinned to v2.0.0 by commit. It is a composite
        # action (PowerShell, no Node runtime). The signed file is the one uploaded below.
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\install.ps1
      - name: Check the install.ps1 signature
        if: steps.version.outputs.release == 'true' && steps.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath install.ps1
          "install.ps1: $($signature.Status), signed by $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "install.ps1 is not validly signed: $($signature.StatusMessage)" }
      - name: Provenance
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true   # a signed record of how the package was built; the installer does not need it
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.pack.outputs.file }}
            windows-development-sandbox.tgz
            install.ps1
            SHA256SUMS
          generate_release_notes: true
          body: |
            Install or update (in PowerShell; it checks your PC, asks "Just me" or "Everyone on this PC", and brings its
            own Node.js). Already installed this way? `sandbox update` does it.
            ```
            irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```
            Or, with Node.js 20+ already installed (updates are then done with npm):
            ```
            npm install -g https://github.com/${{ github.repository }}/releases/latest/download/windows-development-sandbox.tgz
            ```
      - name: Publish to npm
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Only with an NPM_TOKEN secret, and never fails the release: the GitHub release is already out.
          if (-not $env:NODE_AUTH_TOKEN) { "No NPM_TOKEN secret: skipping npm."; exit 0 }
          $name = (Get-Content package.json | ConvertFrom-Json).name
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $registry = 'https://registry.npmjs.org'
          $published = npm view $name versions --json --registry $registry 2>$null
          if ($LASTEXITCODE -ne 0) {
            "::warning::$name is not on npm yet. Publish the first version from your PC with: npm login, then npm run publish:npm"
            exit 0
          }
          if (($published | ConvertFrom-Json) -contains $version) { "$name@$version is already on npm."; exit 0 }
          "//registry.npmjs.org/:_authToken=`${NODE_AUTH_TOKEN}" | Set-Content .npmrc
          npx -y npm@11 publish ${{ steps.pack.outputs.file }} --provenance --access public --registry $registry
          if ($LASTEXITCODE -ne 0) { "::warning::npm publish failed: check that the NPM_TOKEN secret is valid and can publish $name" }
          Remove-Item .npmrc
          exit 0
      - name: Publish to GitHub Packages
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Packages only accepts names scoped to the repository owner (lower-case).
          $scope = '${{ github.repository_owner }}'.ToLower()
          npm pkg set "name=@$scope/windows-development-sandbox" "publishConfig.registry=https://npm.pkg.github.com" "repository.url=https://github.com/${{ github.repository }}.git"
          "@${scope}:registry=https://npm.pkg.github.com`n//npm.pkg.github.com/:_authToken=`${NODE_AUTH_TOKEN}" | Set-Content .npmrc
          npm publish --ignore-scripts

  # A new version is out: test it (CI on Node 22.0.0). This never holds up or undoes the release; it shows whether the
  # version works outside a sandbox. The HCS engine test is run by hand (hcs-engine.yml).
  ci:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/ci.yml

