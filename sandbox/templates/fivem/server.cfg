# A FiveM / RedM development server, made by `sbx-fivem init`. Start it with `sbx-fivem serve`.
#
# No keys in this file: sbx-fivem serve runs FXServer with `+exec <a cfg on the sandbox's own disk>` first, which
# sets sv_licenseKey (and steam_webApiKey) from your saved Cfx.re key (sandbox account login cfx). Keep it that way:
# this file is part of your project.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "{{name}} (development)"
sets sv_projectName "{{name}}"
sets sv_projectDesc "A development server in a Windows Sandbox"
sv_maxclients 8
sv_scriptHookAllowed 0

# Keep it off the public server list (you connect by address).
sv_master1 ""

# The standard resources (chat, spawnmanager, sessionmanager ...) come from cfx-server-data:
#   git clone https://github.com/citizenfx/cfx-server-data
# then copy its resources folder to resources\[cfx-default] and remove the # below.
# ensure mapmanager
# ensure chat
# ensure spawnmanager
# ensure sessionmanager
# ensure basic-gamemode
# ensure hardcap

# oxmysql: sbx-fivem serve sets mysql_connection_string to the sandbox's MariaDB (databases.mysql) when it runs;
# a set mysql_connection_string line here wins over it.
# ensure oxmysql

# Admins: add your identifier (the console shows it when you join) to use admin commands.
# add_principal identifier.fivem:1234567 group.admin
add_ace group.admin command allow

# Your resources: sbx-fivem new <name> adds its ensure line below.
